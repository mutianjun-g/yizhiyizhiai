<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>💌 专属心动告白</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            height: 100%;
            background: #FFF0F5;
            overflow: hidden;
        }
        body {
            position: fixed;
            width: 100vw;
            top: 0;
            left: 0;
        }
        .confession-window {
            width: min(600px, 90vw);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #FFF0F5;
            border-radius: 14px;
            padding: 28px 20px;
            text-align: center;
            box-shadow: 0 0 24px rgba(255,133,161,0.25);
            z-index: 999;
        }
        .title {
            font-size: clamp(14px, 3vw, 17px);
            font-weight: bold;
            color: #FF477E;
            margin-bottom: 12px;
        }
        .main-text {
            font-size: clamp(16px, 4.5vw, 22px);
            font-weight: bold;
            color: #FF2E63;
            margin: 14px 0;
            line-height: 1.5;
        }
        .tip {
            font-size: clamp(11px, 2.2vw, 13px);
            color: #FF85A1;
        }
        .coax {
            font-size: clamp(13px, 2.8vw, 15px);
            font-weight: bold;
            color: #FF2E63;
            margin: 18px 0;
            min-height: 20px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
        }
        .btn-yes {
            padding: 12px 34px;
            font-size: clamp(15px, 3.2vw, 18px);
            font-weight: bold;
            background: #FF85A1;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-no {
            padding: 12px 26px;
            font-size: clamp(13px, 2.8vw, 16px);
            font-weight: bold;
            background: #E6E6E6;
            color: #333;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .float-text {
            position: fixed;
            width: 70px;
            height: 30px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 6px;
            font-size: 9px;
            z-index: 10;
            user-select: none;
        }
        @media (max-width: 480px) {
            .btn-group {
                flex-direction: column;
                align-items: center;
                gap: 14px;
            }
            .btn-yes, .btn-no {
                width: 75%;
            }
        }
    </style>
</head>
<body>
<div class="confession-window" id="confessionBox">
    <div class="title">叮咚~你的专属告白请查收💌</div>
    <div class="main-text">我喜欢你，你愿意做我的女朋友吗💖</div>
    <div class="tip">认真考虑一下哦~</div>
    <div class="coax" id="coaxText"></div>
    <div class="btn-group">
        <button class="btn-yes" id="btnYes">我愿意💖</button>
        <button class="btn-no" id="btnNo">不愿意</button>
    </div>
</div>

<script>
const btnYes = document.getElementById('btnYes');
const btnNo = document.getElementById('btnNo');
const coaxText = document.getElementById('coaxText');
const confessionBox = document.getElementById('confessionBox');

let yesFontSize = 18;
let noFontSize = 16;
const coaxList = [
    "真的不考虑一下吗？",
    "呜呜不要嘛~",
    "再看看我呀✨",
    "不许拒绝我哼😤",
    "再给一次机会好不好~"
];

btnNo.onclick = () => {
    yesFontSize += 14;
    if (noFontSize > 8) noFontSize -= 3;
    btnYes.style.fontSize = yesFontSize + "px";
    btnNo.style.fontSize = noFontSize + "px";
    coaxText.innerText = coaxList[Math.floor(Math.random() * coaxList.length)];
};

btnYes.onclick = () => {
    confessionBox.style.display = "none";
    startHeart();
};

/* ============================================================
   重写爱心轨迹：先算包围盒 → 按屏幕比例缩放 → 居中绘制
   不做任何坐标钳位，爱心形状不会变形
   ============================================================ */
function startHeart() {
    const wordList = ["好好吃饭","好好爱自己","少吃凉的","照顾好自己","我想你了",
                      "天天开心","保持好心情","多赚一点","别熬夜","你是小公主"];
    const colorList = ["#FF6B6B","#FFD1DC","#D946EF","#6366F1","#4ADE80",
                       "#FACC15","#F97316","#8B5CF6","#EC4899","#10B981"];

    const w = document.documentElement.clientWidth;
    const h = document.documentElement.clientHeight;

    // ---- 第一步：生成标准爱心坐标（未缩放）----
    // 爱心方程：x = 16sin³θ, y = 13cosθ - 5cos2θ - 2cos3θ - cos4θ
    // 理论包围盒：x∈[-16,16] 宽32，y∈[-17,13] 高30
    const RAW_POINTS = [];
    const TOTAL = 300;
    for (let i = 0; i < TOTAL; i++) {
        const theta = 2 * Math.PI * i / TOTAL;
        const s = Math.sin(theta);
        const x = 16 * s * s * s;
        const y = 13 * Math.cos(theta)
                - 5 * Math.cos(2 * theta)
                - 2 * Math.cos(3 * theta)
                - Math.cos(4 * theta);
        RAW_POINTS.push([x, y]);
    }

    // ---- 第二步：按屏幕尺寸计算缩放比例，确保完整显示 ----
    // 左右各留 12% 边距，上下各留 12% 边距
    const availW = w * 0.76;   // 可用宽度
    const availH = h * 0.72;   // 可用高度
    // 爱心原始宽32 高30，取较小缩放比，保证完整不溢出
    const scale = Math.min(availW / 32, availH / 30);

    // ---- 第三步：中心点（屏幕正中偏下一点）----
    const cx = w / 2;
    const cy = h / 2 + h * 0.06;

    // ---- 第四步：缩放+平移到屏幕坐标 ----
    const points = RAW_POINTS.map(([x, y]) => [
        cx + x * scale,
        cy - y * scale   // y轴翻转（数学坐标→屏幕坐标）
    ]);

    // ---- 第五步：逐点绘制 ----
    const heartDoms = [];
    let idx = 0;

    function drawNext() {
        if (idx >= points.length) {
            setTimeout(explode, 1000);
            return;
        }
        const [x, y] = points[idx];
        const div = document.createElement('div');
        div.className = "float-text";
        div.style.left = (x - 35) + "px";   // 方块宽70，左移一半居中
        div.style.top = (y - 15) + "px";    // 方块高30，上移一半居中
        div.style.background = colorList[Math.floor(Math.random() * colorList.length)];
        div.innerText = wordList[Math.floor(Math.random() * wordList.length)];
        document.body.appendChild(div);
        heartDoms.push(div);
        idx++;
        setTimeout(drawNext, 40);
    }
    drawNext();

    // ---- 爆炸粒子 ----
    function explode() {
        heartDoms.forEach(d => d.style.display = "none");
        const maxCount = w < 480 ? 250 : 450;
        let count = 0;
        const timer = setInterval(() => {
            if (count >= maxCount) {
                clearInterval(timer);
                return;
            }
            const div = document.createElement('div');
            div.className = "float-text";
            div.style.left = Math.random() * (w - 80) + "px";
            div.style.top = (40 + Math.random() * (h - 90)) + "px";
            div.style.background = colorList[Math.floor(Math.random() * colorList.length)];
            div.innerText = wordList[Math.floor(Math.random() * wordList.length)];
            document.body.appendChild(div);
            count++;
        }, w < 480 ? 10 : 5);
    }
}
</script>
</body>
</html>
